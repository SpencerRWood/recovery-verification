{
  "name": "Release",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "release_approved": {
          "description": "Confirm the reviewed release scope and main revision are approved for publication",
          "type": "boolean",
          "required": true,
          "default": false
        },
        "approved_revision": {
          "description": "Exact reviewed current main SHA authorized for this publication",
          "type": "string",
          "required": true
        },
        "recovery_approved": {
          "description": "Separate authorization to reuse a candidate or resume partial publication",
          "type": "boolean",
          "required": true,
          "default": false
        }
      }
    },
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "jobs": {
    "release": {
      "if": "github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_approved == true))",
      "uses": "SpencerRWood/workflows/.github/workflows/release-container.yml@613bb7d915cec854b5f7f2b5d26e963c8a4ada3f",
      "with": {
        "require_approval": "${{ github.event_name == 'workflow_dispatch' }}",
        "workflow_revision": "613bb7d915cec854b5f7f2b5d26e963c8a4ada3f",
        "approved": "${{ inputs.release_approved == true }}",
        "approved_revision": "${{ inputs.approved_revision }}",
        "recovery_approved": "${{ inputs.recovery_approved == true }}"
      },
      "permissions": {
        "contents": "write",
        "packages": "write",
        "id-token": "write",
        "attestations": "write"
      }
    }
  }
}
