version = 1

[python]
version = "3.14"

[validation]
checks = ["ruff", "ruff-format", "mypy", "pytest", "pre-commit"]

[build]
python_package = true

[dagster]
runtime_validation = true
smoke_job = "runtime_smoke_job"

[container]
publish = true
image_name = "recovery-verification"

[release]
semantic_release = true
